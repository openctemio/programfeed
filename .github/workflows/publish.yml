name: Publish bundle

# Daily: build the next program bundle from the previous release and the
# sources, sign it, verify it and publish it as a GitHub Release.
#
# Two jobs on purpose. "build" talks to the sources and never sees the
# signing key. "publish" runs in the protected "publish" environment (only
# the default branch can deploy to it), holds the signing key and nothing
# else, and only signs, verifies and uploads what "build" produced.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      allow_mass_change:
        description: "Accept a source that lost more than half of its programs (only after checking the source)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ready: ${{ steps.keys.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Key ceremony done?
        id: keys
        run: |
          if [ -s keys/root-keyid.txt ] && [ -s keys/keyset.dsse.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No keys yet (keys/root-keyid.txt, keys/keyset.dsse.json): nothing is published until the key ceremony in keys/README.md is done"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: steps.keys.outputs.ready == 'true'
        name: Test
        run: go test ./...
      - if: steps.keys.outputs.ready == 'true'
        name: Build the CLI
        run: go build -trimpath -ldflags "-X main.version=${GITHUB_SHA::12}" -o programfeed ./cmd/programfeed
      - if: steps.keys.outputs.ready == 'true'
        name: Restore the HTTP cache (conditional requests only; every body is re-validated)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: httpcache
          key: httpcache-${{ github.run_id }}
          restore-keys: httpcache-
      - if: steps.keys.outputs.ready == 'true'
        name: Download the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --dir prev --pattern 'snapshot*' --pattern 'latest.dsse.json' --pattern 'keyset.dsse.json'
            echo "PREV=--prev=prev" >> "$GITHUB_ENV"
          fi
      - if: steps.keys.outputs.ready == 'true'
        name: Build the bundle
        env:
          MASS: ${{ inputs.allow_mass_change && '--allow-mass-change' || '' }}
        run: ./programfeed build --out out --cache httpcache --root-key-id "$(cat keys/root-keyid.txt)" $PREV $MASS
      - if: steps.keys.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: out/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the CLI
        run: go build -trimpath -o programfeed ./cmd/programfeed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: out
      - name: Sign
        env:
          PROGRAMFEED_SIGNING_KEY: ${{ secrets.PROGRAMFEED_SIGNING_KEY }}
        run: ./programfeed sign --dir out --keyset keys/keyset.dsse.json --root-key-id "$(cat keys/root-keyid.txt)"
      - name: Verify as the platform does
        run: ./programfeed verify --dir out --root-key-id "$(cat keys/root-keyid.txt)"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 -c 'import json,base64,sys; e=json.load(open("out/latest.dsse.json")); print(json.loads(base64.b64decode(e["payload"]))["tag"])')"
          cat > notes.md <<'NOTES'
          Public program bundle for OpenCTEM: a signed snapshot of public bug-bounty and vulnerability-disclosure programs, and the delta from the previous release.

          Targets marked "inferred" are suggestions, not a program's published scope. See NOTICE for the terms of every source.
          NOTES
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md out/*
      - name: Keep the last 60 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[60:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
